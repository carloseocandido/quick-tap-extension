<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quick Tap</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1 data-i18n="title">QUICK TAP</h1>
      <p class="sub">
        <span class="blink" data-i18n="insertCoin">INSERT COIN</span> •
        <span data-i18n="subtitle">Tap fast. Grow forever.</span>
      </p>
    </header>

    <main>
      <section class="stats">
        <div class="panel">
          <div class="label" data-i18n="score">Score</div>
          <div id="points" class="value">0</div>
        </div>

        <div class="panel">
          <div class="label" data-i18n="perSecond">Per second</div>
          <div id="pps" class="value">0</div>
        </div>
      </section>

      <div class="tap-wrap">
        <button id="tap" class="tap" data-i18n="tap">TAP!</button>
        <div id="tapArea" class="tap-area"></div>
      </div>

      <section class="shop">
        <button id="buyAuto" class="buy">
          <span data-i18n="autoTap"><strong>Auto</strong> Tap (+1/s)</span>
          <span id="autoPrice" class="price">(50)</span>
        </button>
      </section>

      <div class="lang-selector">
        <label for="language" data-i18n="language">Language</label>
        <select id="language">
          <option value="en">EN</option>
          <option value="pt-br">PT-BR</option>
        </select>
      </div>

      <div id="toast" class="toast"></div>
    </main>

    <footer class="footer">
      <span class="dev">
        <span data-i18n="developedBy">Developed by</span>
        <strong class="dev-name">carloseocandido</strong>
      </span>

      <span class="links">
        <a href="https://github.com/carloseocandido" target="_blank" rel="noopener noreferrer">
          GitHub
        </a>
        ·
      </span>
    </footer>

    <script src="dist/popup.js"></script>
  </body>
</html>
