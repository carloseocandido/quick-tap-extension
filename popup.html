<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quick Tap</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>QUICK TAP</h1>
      <p class="sub"><span class="blink">INSERT COIN</span> • Tap fast. Grow forever.</p>
    </header>

    <main>
      <section class="stats">
        <div class="panel">
          <div class="label">Score</div>
          <div id="points" class="value">0</div>
        </div>

        <div class="panel">
          <div class="label">Per second</div>
          <div id="pps" class="value">0</div>
        </div>
      </section>

      <div class="tap-wrap">
        <button id="tap" class="tap">TAP!</button>
        <div id="tapArea" class="tap-area"></div>
      </div>

      <section class="shop">
        <button id="buyAuto" class="buy">
          <span><strong>Auto</strong> Tap (+1/s)</span>
          <span id="autoPrice" class="price">(50)</span>
        </button>
      </section>

      <div id="toast" class="toast"></div>
    </main>

    <footer class="footer">
      <span class="dev"> Developed by <strong class="dev-name">carloseocandido</strong> </span>

      <span class="links">
        <a href="https://github.com/carloseocandido" target="_blank" rel="noopener noreferrer">
          GitHub
        </a>
        ·
      </span>
    </footer>

    <script src="dist/popup.js"></script>
  </body>
</html>
